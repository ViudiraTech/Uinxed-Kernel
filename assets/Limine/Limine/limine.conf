default_entry: 1
timeout: 3
verbose: yes
wallpaper: boot():/Limine/background.jpg

/Uinxed-Kernel
    protocol: limine
    kernel_path: boot():/EFI/Boot/UxImage
    module_path: boot():/init
    module_path: boot():/initramfs.cpio
    # Keep kernel/TTY diagnostics on the emulated serial console.  tty1 is
    # reserved for the graphical Weston session and is never a log sink.
    kernel_cmdline: console=ttyS0
    kaslr: yes
